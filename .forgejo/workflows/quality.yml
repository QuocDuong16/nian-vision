name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.0"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: docker
    timeout-minutes: 60
    container:
      image: rust:1.98.0-bookworm

    steps:
      - name: Install system packages
        run: |
          set -Eeuo pipefail
          apt-get update
          # webkit/gtk: Tauri desktop shell build; xz: ffmpeg tarball;
          # curl: pinned downloads.
          apt-get install -y --no-install-recommends \
            build-essential pkg-config xz-utils curl \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build pinned FFmpeg 8.0.1 (ABI 62)
        run: scripts/ci-install-ffmpeg.sh

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        env:
          NIAN_FFMPEG_LIB_DIR: ${{ github.workspace }}/ffmpeg-dist/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffmpeg-dist/lib
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        env:
          NIAN_FFMPEG_LIB_DIR: ${{ github.workspace }}/ffmpeg-dist/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/ffmpeg-dist/lib
        run: cargo test --workspace

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: cargo deny check
        run: cargo deny check

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: docker
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: https://data.forgejo.org/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
