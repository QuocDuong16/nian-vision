name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: docker
    timeout-minutes: 60
    container:
      image: rust:1.99.1-bookworm@sha256:48b7f435b8fc6378ce43b44f15e3a47fd8919b2825f835c39bd4bd3da50af5b8

    steps:
      # actions/checkout is Node-based, so a pinned runtime must exist before
      # the repository is available. The post-checkout step verifies it
      # against mise.toml.
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.9.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="c6ecd8efc1c1d395265891675319da7a7b3785c6be174bd78933cf4f057624d1"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="686d07ed3bc5d68d9f7bd4939b7e8849a87d0664ac19c8c5474474f44cc956db"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Provision mise-pinned toolchain
        run: |
          set -Eeuo pipefail
          rust_version="$(scripts/toolchain-pins.sh rust)"
          node_version="$(scripts/toolchain-pins.sh node)"
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
          rustup override set "$rust_version"
          test "$(node --version)" = "v${node_version}"
          rustc --version
          node --version

      - name: Install desktop build prerequisites
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            xz-utils \
            curl \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      - name: Build pinned FFmpeg 8.0.3 (ABI 62)
        run: scripts/ci-install-ffmpeg.sh

      - name: Windows-only platform Clippy smoke
        run: |
          set -Eeuo pipefail
          rustup target add x86_64-pc-windows-msvc
          cargo clippy -p nian-platform-windows --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/ffmpeg-dist/lib"
          export LD_LIBRARY_PATH="$PWD/ffmpeg-dist/lib"
          cargo check --workspace

      - name: cargo clippy
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/ffmpeg-dist/lib"
          export LD_LIBRARY_PATH="$PWD/ffmpeg-dist/lib"
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/ffmpeg-dist/lib"
          export LD_LIBRARY_PATH="$PWD/ffmpeg-dist/lib"
          cargo test --workspace

      - name: Install pinned cargo-deny and cargo-machete
        run: |
          set -Eeuo pipefail
          cargo install cargo-deny --locked --version "$(scripts/toolchain-pins.sh cargo-deny)"
          cargo install cargo-machete --locked --version "$(scripts/toolchain-pins.sh cargo-machete)"

      - name: cargo deny check
        run: cargo deny check

      - name: cargo machete
        run: cargo machete

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: docker
    timeout-minutes: 30
    container:
      # Bootstrap image only; the job verifies Node against mise.toml.
      image: node:26.9.0-bookworm

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify mise-pinned Node.js
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v$(scripts/toolchain-pins.sh node)"

      - name: Install verified standalone pnpm
        run: |
          set -Eeuo pipefail
          bash scripts/install-pnpm-linux.sh
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
