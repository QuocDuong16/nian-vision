name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  PRODUCTION_RELEASE: "true"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  linux-x86_64:
    name: Linux x86_64 AppImage
    runs-on: docker
    timeout-minutes: 120
    container:
      image: rust:1.98.0-bookworm

    steps:
      - name: Install pinned Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/${node_archive}" | sha256sum --check --strict -
          tar --extract --xz --file "/tmp/${node_archive}" --directory /usr/local --strip-components=1
          node --version

      - name: Check out exact source
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a production release tag
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
            *) echo "Production release must run from a v* tag, got ${GITHUB_REF:-<unset>}" >&2; exit 1 ;;
          esac
          node scripts/release/version-check.mjs --tag "$tag" --require-clean

      - name: Install Linux release prerequisites
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential \
            binutils \
            curl \
            dbus-x11 \
            file \
            fuse3 \
            git \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            xauth \
            xvfb \
            xz-utils

      - name: Install pinned pnpm
        run: |
          set -Eeuo pipefail
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.22.0
          corepack --version
          pnpm --version

      - name: Linux runner preflight
        run: scripts/release/preflight-linux.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Release script and updater-verifier tests
        run: |
          set -Eeuo pipefail
          pnpm release:test
          cargo clippy -p nian-release-verifier --all-targets -- -D warnings
          cargo test -p nian-release-verifier

      - name: Frontend quality and release asset build
        run: |
          set -Eeuo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Build pinned FFmpeg 8.0.3 Linux runtime
        run: scripts/release/build-ffmpeg-linux.sh

      - name: Validate candidate FFmpeg against media fixtures
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo test -p nian-media-ffmpeg --test media_integration

      - name: Rust quality against release FFmpeg
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace

      - name: Build release media worker
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo build -p nian-media-worker --release

      - name: Stage and clean-smoke Linux runtime
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: scripts/release/stage-linux.sh

      - name: Generate release-only Tauri configuration
        env:
          NIAN_UPDATER_ENDPOINT: ${{ secrets.NIAN_UPDATER_ENDPOINT }}
          NIAN_UPDATER_PUBLIC_KEY: ${{ secrets.NIAN_UPDATER_PUBLIC_KEY }}
        run: node scripts/release/write-tauri-release-config.mjs

      - name: Build signed updater AppImage
        env:
          NIAN_UPDATER_CONFIGURED: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required" >&2; exit 1; }
          cd apps/nian-desktop
          ../../ui/node_modules/.bin/tauri build \
            --config tauri.release.generated.conf.json \
            --bundles appimage \
            --ci

      - name: Verify updater signature against configured public key
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ secrets.NIAN_UPDATER_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          configured_public_key="$(node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("apps/nian-desktop/tauri.release.generated.conf.json","utf8")); process.stdout.write(c.plugins.updater.pubkey)')"
          [[ "$configured_public_key" == "$NIAN_UPDATER_PUBLIC_KEY" ]] || { echo "generated updater public key differs from release configuration input" >&2; exit 1; }
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#images[@]}" -eq 1 ]] || { echo "expected exactly one generated AppImage" >&2; exit 1; }
          test -f "${images[0]}.sig" || { echo "generated AppImage signature is missing" >&2; exit 1; }
          NIAN_UPDATER_PUBLIC_KEY="$configured_public_key" cargo run --quiet -p nian-release-verifier -- "${images[0]}" "${images[0]}.sig"

      - name: Dispose generated Tauri release configuration
        run: rm -f apps/nian-desktop/tauri.release.generated.conf.json

      - name: Smoke actual AppImage runtime and desktop startup
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: scripts/release/smoke-appimage.sh

      - name: Finalize manifest, updater metadata and SHA-256 checksums
        env:
          NIAN_RELEASE_DOWNLOAD_BASE_URL: ${{ secrets.NIAN_RELEASE_DOWNLOAD_BASE_URL }}
        run: node scripts/release/finalize-linux-release.mjs

      - name: Validate finalized updater metadata relationships
        run: node scripts/release/validate-release-output.mjs

      - name: Verify checksum manifest
        run: |
          set -Eeuo pipefail
          cd dist/release
          sha256sum --check --strict SHA256SUMS.txt

      - name: Final secret sentinel scan
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: node scripts/release/scan-release-secrets.mjs ui/dist dist/release

      - name: Upload Linux release artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: nian-vision-linux-x86_64-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
