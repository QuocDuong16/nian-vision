# cargo-deny configuration — run via `cargo deny check` (CI: quality workflow).

[graph]
all-features = true

[licenses]
version = 2
# LicenseRef-Proprietary covers this repository's own crates.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "LicenseRef-Proprietary",
]
confidence-threshold = 0.93

[bans]
# Keep the lockfile's expected transitive version overlap quiet. Cargo audit
# still scans every locked version for known advisories.
multiple-versions = "allow"
# External dependencies are versioned explicitly; wildcard path dependencies
# are not used after local workspace crates declare their major version range.
wildcards = "warn"
highlight = "all"

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained and remains in Tauri's GTK macro stack.
  # No vulnerabilities, no fixed version is currently available.
  "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
