[package]
name = "nian-media-worker"
description = "Isolated media worker process: RTSP/container operations over IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "nian-media-worker"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
ctrlc = { workspace = true }
nian-domain = { workspace = true }
nian-ipc = { workspace = true }
nian-media = { workspace = true }
nian-media-ffmpeg = { workspace = true }
nian-recorder = { workspace = true }
nian-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
nian-ffmpeg-sys = { workspace = true }
tempfile = { workspace = true }
# Test-only recovery hooks (deterministic delay/fault seams) so the job
# lifecycle tests can hold asynchronous recovery at known checkpoints.
# Production builds never enable the feature.
nian-recorder = { path = "../../crates/nian-recorder", features = ["test-hooks"] }

[lints]
workspace = true
