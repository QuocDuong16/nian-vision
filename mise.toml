# Repo-local toolchain pins. Keep Rust aligned with Cargo, rust-toolchain.toml,
# CI, and release workflows; keep Node/pnpm aligned with their CI pins.
[settings]
lockfile = true

[tool_alias]
# The aqua registry excludes macOS x64 despite pnpm publishing that artifact.
pnpm = "github:pnpm/pnpm"

[tools]
# mise.toml is the authoritative toolchain pin. CI and release scripts resolve
# these values directly; rust-toolchain.toml and Cargo.toml mirror the Rust pin.
# Update this file first, then run `mise lock`.
rust = "1.99.1"
# Keep the standalone pnpm binary ahead of Node's bundled executables in PATH.
pnpm = "12.16.1"
node = "26.9.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-machete" = "0.9.2"
