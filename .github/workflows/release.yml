name: Production Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  PRODUCTION_RELEASE: "true"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  release-preflight:
    name: Release authority preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact mirrored tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned Node.js
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/${node_archive}" | sha256sum --check --strict -
          sudo tar --extract --xz --file "/tmp/${node_archive}" --directory /usr/local --strip-components=1
          node --version

      - name: Prove Forgejo-mirror tag identity
        id: identity
        env:
          RELEASE_MIRROR_ACTOR: ${{ vars.RELEASE_MIRROR_ACTOR }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;;
            *) echo "Production release requires an actual refs/tags/v* ref" >&2; exit 1 ;;
          esac
          test -n "${RELEASE_MIRROR_ACTOR:-}" || { echo "RELEASE_MIRROR_ACTOR repository variable is required" >&2; exit 1; }
          [[ "${GITHUB_ACTOR:-}" == "$RELEASE_MIRROR_ACTOR" ]] || { echo "release tag was not delivered by the configured mirror identity" >&2; exit 1; }
          git fetch --force --tags origin
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          [[ "$head_sha" == "$GITHUB_SHA" ]] || { echo "checked-out HEAD differs from GITHUB_SHA" >&2; exit 1; }
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo "release tag does not resolve to GITHUB_SHA" >&2; exit 1; }
          test -n "${DEFAULT_BRANCH:-}" || { echo "mirrored default branch is unavailable" >&2; exit 1; }
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}" || {
            echo "release commit is not reachable from the mirrored default branch" >&2
            exit 1
          }
          node scripts/release/version-check.mjs --tag "$tag" --require-clean
          version="${tag#v}"
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux x86_64 AppImage
    needs: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: rust:1.98.0-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Trust checked-out workspace ownership
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Re-prove release source identity
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "build checkout differs from GITHUB_SHA" >&2; exit 1; }
          [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "$GITHUB_SHA" ]] || { echo "build tag differs from GITHUB_SHA" >&2; exit 1; }

      - name: Provision Rust quality components
        run: |
          set -Eeuo pipefail
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install pinned Node.js
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/${node_archive}" | sha256sum --check --strict -
          tar --extract --xz --file "/tmp/${node_archive}" --directory /usr/local --strip-components=1
          node --version
          node scripts/release/version-check.mjs --tag "${GITHUB_REF_NAME}" --require-clean

      - name: Install Linux release prerequisites
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential binutils curl dbus-x11 file fuse3 git \
            libayatana-appindicator3-1 libayatana-appindicator3-dev libegl1 libfuse2 libgles2 librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config xauth xvfb xz-utils

      - name: Install pinned pnpm
        run: |
          set -Eeuo pipefail
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.22.0
          corepack --version
          pnpm --version

      - name: Linux runner preflight
        run: scripts/release/preflight-linux.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Release script and updater-verifier tests
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/nian-quality-target"
          pnpm release:test
          cargo clippy -p nian-release-verifier --all-targets -- -D warnings
          cargo test -p nian-release-verifier

      - name: Frontend quality and release asset build
        run: |
          set -Eeuo pipefail
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Build pinned FFmpeg 8.0.3 Linux runtime
        run: scripts/release/build-ffmpeg-linux.sh

      - name: Validate candidate FFmpeg against media fixtures
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/nian-quality-target"
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo test -p nian-media-ffmpeg --test media_integration

      - name: Rust quality against release FFmpeg
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/nian-quality-target"
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace

      - name: Dispose Linux quality Cargo target
        if: always()
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/nian-quality-target"
          df -h "$GITHUB_WORKSPACE"

      - name: Build release media worker
        run: |
          set -Eeuo pipefail
          export NIAN_FFMPEG_LIB_DIR="$PWD/dist/ffmpeg-linux-x86_64/lib"
          export LD_LIBRARY_PATH="$NIAN_FFMPEG_LIB_DIR"
          cargo build -p nian-media-worker --release

      - name: Stage and clean-smoke Linux runtime
        run: scripts/release/stage-linux.sh

      - name: Release Linux Cargo intermediates before desktop build
        run: |
          set -Eeuo pipefail
          echo "Disk usage before release-target handoff:"
          df -h "$GITHUB_WORKSPACE"
          du -sh target dist ui/dist 2>/dev/null || true
          rm -rf target/release
          echo "Disk usage after staged worker handoff:"
          df -h "$GITHUB_WORKSPACE"
          du -sh target dist ui/dist 2>/dev/null || true

      - name: Generate release-only Tauri configuration
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
          NIAN_UPDATER_ENDPOINT: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: node scripts/release/write-tauri-release-config.mjs

      - name: Guard Linux disk before Tauri build
        run: |
          set -Eeuo pipefail
          echo "Pre-Tauri disk diagnostics:"
          df -h "$GITHUB_WORKSPACE"
          du -sh target dist ui/dist 2>/dev/null || true
          minimum_free_kb=$((10 * 1024 * 1024))
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          [[ "$available_kb" =~ ^[0-9]+$ ]] || { echo "unable to determine pre-Tauri free disk space" >&2; exit 1; }
          if (( available_kb < minimum_free_kb )); then
            echo "pre-Tauri free disk space is below the required 10 GiB guard: ${available_kb} KiB available" >&2
            exit 1
          fi

      - name: Build unsigned Linux application
        env:
          NIAN_UPDATER_CONFIGURED: "1"
        run: |
          set -Eeuo pipefail
          cd apps/nian-desktop
          ../../ui/node_modules/.bin/tauri build --config tauri.release.generated.conf.json --no-bundle --ci
          test -x ../../target/release/nian-desktop || { echo "Tauri no-bundle build did not produce target/release/nian-desktop" >&2; exit 1; }

      - name: Prepare Linux AppImage bundle disk
        run: bash scripts/release/prepare-linux-appimage.sh

      - name: Bundle unsigned AppImage
        env:
          NIAN_UPDATER_CONFIGURED: "1"
        run: |
          set -Eeuo pipefail
          cd apps/nian-desktop
          tauri_cli="../../ui/node_modules/.bin/tauri"
          echo "Starting Linux AppImage bundle phase"
          "$tauri_cli" --version
          echo "APPIMAGE_EXTRACT_AND_RUN=${APPIMAGE_EXTRACT_AND_RUN:-<unset>}"
          df -Pk "$GITHUB_WORKSPACE"
          bundle_started="$(date +%s)"
          if "$tauri_cli" bundle --config tauri.release.generated.conf.json --bundles appimage --ci --no-sign --verbose; then
            bundle_status=0
          else
            bundle_status=$?
            bundle_finished="$(date +%s)"
            echo "Linux AppImage bundle failed with exit code ${bundle_status} after $((bundle_finished - bundle_started)) seconds" >&2
            df -h
            df -Pk "$GITHUB_WORKSPACE"
            du -sh ../../target/release ../../target/release/bundle ../../target/release/bundle/appimage 2>/dev/null || true
            exit "$bundle_status"
          fi
          bundle_finished="$(date +%s)"
          echo "Linux AppImage bundle completed with exit code ${bundle_status} after $((bundle_finished - bundle_started)) seconds"

      - name: Normalize AppImage FFmpeg runtime layout
        run: |
          scripts/release/normalize-appimage-ffmpeg.sh

      - name: Report Linux AppImage bundle disk state
        if: always()
        run: |
          set -Eeuo pipefail
          echo "Post-AppImage bundle disk diagnostics:"
          df -h
          df -Pk "$GITHUB_WORKSPACE"
          du -sh target target/release target/release/bundle target/release/bundle/appimage dist ui/dist 2>/dev/null || true
          du -x -k --max-depth=2 target/release/bundle 2>/dev/null | sort -nr | sed -n '1,30p' || true

      - name: Dispose generated Tauri release configuration
        if: always()
        run: rm -f apps/nian-desktop/tauri.release.generated.conf.json

      - name: Smoke normalized AppImage runtime and desktop startup
        run: scripts/release/smoke-appimage.sh

      - name: Upload unsigned Linux build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-unsigned-build
          path: |
            target/release/bundle/appimage/*.AppImage
            dist/linux-x86_64/
            ui/dist/
          if-no-files-found: error
          retention-days: 1


  sign-linux:
    name: Sign and finalize Linux candidate
    needs: [release-preflight, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-release
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned Node.js
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --output "/tmp/${node_archive}" "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/${node_archive}" | sha256sum --check --strict -
          sudo tar --extract --xz --file "/tmp/${node_archive}" --directory /usr/local --strip-components=1

      - name: Install pinned Rust verifier and Tauri signing toolchain
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo install tauri-cli --version 2.11.4 --locked

      - name: Install Linux AppImage smoke runtime prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            dbus-x11 fuse3 libayatana-appindicator3-1 libegl1 libgles2 xauth xvfb
          ldconfig -p | grep -E 'lib(ayatana-)?appindicator3\.so\.1'
          ldconfig -p | grep -F 'libEGL.so.1'
          ldconfig -p | grep -F 'libGLESv2.so.2'

      - name: Download unsigned Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-unsigned-build
          path: .

      - name: Restore downloaded Linux AppImage executable mode
        run: |
          set -Eeuo pipefail
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#images[@]}" -eq 1 ]] || { echo "expected exactly one downloaded Linux AppImage" >&2; exit 1; }
          [[ -f "${images[0]}" && ! -L "${images[0]}" ]] || { echo "downloaded Linux AppImage is not a regular file" >&2; exit 1; }
          chmod 0755 "${images[0]}"
          [[ -x "${images[0]}" ]] || { echo "failed to restore downloaded Linux AppImage executable mode" >&2; exit 1; }

      - name: Scan staged Linux runtime and frontend boundary
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: node scripts/release/scan-release-secrets.mjs dist/linux-x86_64 ui/dist

      - name: Sign Linux updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#images[@]}" -eq 1 ]] || { echo "expected exactly one unsigned Linux AppImage" >&2; exit 1; }
          cargo tauri signer sign "${images[0]}"

      - name: Verify Linux updater signature
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          NIAN_UPDATER_PUBLIC_KEY="$NIAN_UPDATER_PUBLIC_KEY" cargo run --quiet -p nian-release-verifier -- "${images[0]}" "${images[0]}.sig"

      - name: Smoke signed Linux AppImage boundary
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: scripts/release/smoke-appimage.sh

      - name: Finalize Linux platform candidate
        run: node scripts/release/finalize-platform-candidate.mjs linux

      - name: Scan finalized Linux candidate
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: node scripts/release/scan-release-secrets.mjs dist/candidate-linux

      - name: Upload Linux release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-candidate
          path: dist/candidate-linux/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows x86_64 build
    needs: release-preflight
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Re-prove release source identity
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { git.exe fetch --force --tags origin }
          $head = (Invoke-NianNative { git.exe rev-parse HEAD } | Out-String).Trim()
          $tag = (Invoke-NianNative { git.exe rev-parse "$env:GITHUB_REF^{commit}" } | Out-String).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Windows build checkout differs from GITHUB_SHA" }
          if ($tag -ne $env:GITHUB_SHA) { throw "Windows build tag differs from GITHUB_SHA" }

      - name: Install pinned Rust 1.98.0 MSVC toolchain
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { rustup.exe toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy }
          Invoke-NianNative { rustup.exe override set 1.98.0 }
          Invoke-NianNative { rustc.exe --version }
          Invoke-NianNative { cargo.exe --version }
          Invoke-NianNative { cargo.exe fmt --version }
          Invoke-NianNative { cargo.exe clippy --version }

      - name: Install pinned Node.js 26.7.0
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'node-v26.7.0-win-x64.zip'
          Invoke-WebRequest 'https://nodejs.org/dist/v26.7.0/node-v26.7.0-win-x64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'd3bd72755141ed32bbcd841228ee81897c8a98d50dfa7dae2179399a0a7c90f8') { throw 'Node.js Windows archive SHA-256 mismatch' }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'node-v26.7.0-win-x64'
          Add-Content $env:GITHUB_PATH $nodeRoot
          . scripts/release/windows-native.ps1
          Invoke-NianNative { & (Join-Path $nodeRoot 'node.exe') --version }

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          $corepackRoot = Join-Path $env:RUNNER_TEMP 'nian-corepack-0.35.0'
          Remove-Item -Recurse -Force $corepackRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $corepackRoot | Out-Null
          Invoke-NianNative { npm.cmd install --global --prefix $corepackRoot corepack@0.35.0 }
          $corepack = Join-Path $corepackRoot 'corepack.cmd'
          if (-not (Test-Path $corepack)) { throw "pinned Corepack install did not create corepack.cmd" }
          Invoke-NianNative { & $corepack enable --install-directory $corepackRoot }
          Invoke-NianNative { & $corepack install --global pnpm@11.22.0 }
          Add-Content $env:GITHUB_PATH $corepackRoot
          Invoke-NianNative { & (Join-Path $corepackRoot 'pnpm.cmd') --version }

      - name: Provision pinned MSYS FFmpeg build tools
        shell: pwsh
        run: scripts/release/provision-ffmpeg-msys-tools.ps1

      - name: Windows runner preflight
        shell: pwsh
        run: scripts/release/preflight-windows.ps1

      - name: Test Windows VC runtime classifier and application-local staging
        shell: pwsh
        run: scripts/release/test-windows-runtime-classifier.ps1

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { pnpm.cmd install --frozen-lockfile }

      - name: Release scripts and frontend quality
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { pnpm.cmd release:test }
          Invoke-NianNative { pnpm.cmd lint }
          Invoke-NianNative { pnpm.cmd typecheck }
          Invoke-NianNative { pnpm.cmd test }
          Invoke-NianNative { pnpm.cmd build }

      - name: Compute Windows FFmpeg build contract
        id: ffmpeg-contract
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          $digest = (Invoke-NianNative { node.exe scripts/release/ffmpeg-cache-key.mjs } | Out-String).Trim()
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw "Windows FFmpeg build contract did not produce a SHA-256 digest" }
          $key = "windows-ffmpeg-$digest"
          Write-Host "FFmpeg cache key: $key"
          "digest=$digest" >> $env:GITHUB_OUTPUT
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore exact Windows FFmpeg build cache
        id: ffmpeg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/ffmpeg-windows-x86_64
          key: ${{ steps.ffmpeg-contract.outputs.key }}

      - name: Validate restored Windows FFmpeg cache
        id: ffmpeg-cache-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cacheHit = '${{ steps.ffmpeg-cache.outputs.cache-hit }}' -eq 'true'
          $sourceBuildRequired = $true
          $cacheValid = $false
          Write-Host "FFmpeg cache hit: $($cacheHit.ToString().ToLowerInvariant())"
          if ($cacheHit) {
            try {
              scripts/release/validate-ffmpeg-windows.ps1 -OutputDir (Join-Path $pwd 'dist\ffmpeg-windows-x86_64')
              $sourceBuildRequired = $false
              $cacheValid = $true
            }
            catch {
              Write-Warning "restored FFmpeg cache failed release-contract validation and will be discarded: $($_.Exception.Message)"
              Remove-Item -Recurse -Force (Join-Path $pwd 'dist\ffmpeg-windows-x86_64') -ErrorAction SilentlyContinue
            }
          }
          else {
            Remove-Item -Recurse -Force (Join-Path $pwd 'dist\ffmpeg-windows-x86_64') -ErrorAction SilentlyContinue
          }
          $artifactCacheHit = $false
          if ($sourceBuildRequired) {
            . scripts/release/restore-ffmpeg-windows-artifact-cache.ps1
            $artifactName = "windows-ffmpeg-cache-${{ steps.ffmpeg-contract.outputs.digest }}"
            try {
              $artifactCacheHit = Restore-NianWindowsFfmpegArtifactCache -ArtifactName $artifactName -OutputDir (Join-Path $pwd 'dist\ffmpeg-windows-x86_64')
            }
            catch {
              Write-Warning "cross-tag FFmpeg artifact cache lookup was unavailable; pinned source build remains authoritative: $($_.Exception.Message)"
              Remove-Item -Recurse -Force (Join-Path $pwd 'dist\ffmpeg-windows-x86_64') -ErrorAction SilentlyContinue
              $artifactCacheHit = $false
            }
            if ($artifactCacheHit) {
              $sourceBuildRequired = $false
              $cacheValid = $true
            }
          }
          Write-Host "FFmpeg cache valid: $($cacheValid.ToString().ToLowerInvariant())"
          Write-Host "FFmpeg cross-tag artifact cache hit: $($artifactCacheHit.ToString().ToLowerInvariant())"
          Write-Host "FFmpeg source build required: $($sourceBuildRequired.ToString().ToLowerInvariant())"
          "cache-valid=$($cacheValid.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "artifact-cache-hit=$($artifactCacheHit.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "source-build-required=$($sourceBuildRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build pinned FFmpeg 8.0.3 Windows MSVC runtime
        if: steps.ffmpeg-cache-state.outputs.source-build-required == 'true'
        shell: pwsh
        timeout-minutes: 150
        run: scripts/release/build-ffmpeg-windows.ps1

      - name: Validate resolved Windows FFmpeg runtime
        shell: pwsh
        run: scripts/release/validate-ffmpeg-windows.ps1

      - name: Validate Windows FFmpeg media integration
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          $env:NIAN_FFMPEG_LIB_DIR = Join-Path $pwd 'dist\ffmpeg-windows-x86_64\lib'
          $env:PATH = "$(Join-Path $pwd 'dist\ffmpeg-windows-x86_64\bin');$env:PATH"
          Invoke-NianNative { cargo.exe test -p nian-media-ffmpeg --test media_integration }

      - name: Save validated Windows FFmpeg build cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/ffmpeg-windows-x86_64
          key: ${{ steps.ffmpeg-contract.outputs.key }}

      - name: Upload validated Windows FFmpeg cross-tag cache artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ffmpeg-cache-${{ steps.ffmpeg-contract.outputs.digest }}
          path: dist/ffmpeg-windows-x86_64/
          if-no-files-found: error
          retention-days: 90

      - name: Run remaining Windows Rust quality and release worker build
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          $env:NIAN_FFMPEG_LIB_DIR = Join-Path $pwd 'dist\ffmpeg-windows-x86_64\lib'
          $env:PATH = "$(Join-Path $pwd 'dist\ffmpeg-windows-x86_64\bin');$env:PATH"
          Invoke-NianNative { cargo.exe fmt --all --check }
          Invoke-NianNative { cargo.exe clippy --all-targets -- -D warnings }
          Invoke-NianNative { cargo.exe test --workspace }
          Invoke-NianNative { cargo.exe build -p nian-media-worker --target x86_64-pc-windows-msvc --release }

      - name: Stage and clean-smoke Windows runtime
        shell: pwsh
        run: scripts/release/stage-windows.ps1

      - name: Generate public-only Windows Tauri configuration
        shell: pwsh
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
          NIAN_UPDATER_ENDPOINT: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { node.exe scripts/release/write-tauri-windows-release-config.mjs }

      - name: Build unsigned Windows desktop binary
        shell: pwsh
        env:
          NIAN_UPDATER_CONFIGURED: "1"
        run: |
          . scripts/release/windows-native.ps1
          $repo = $pwd.Path
          $env:NIAN_FFMPEG_LIB_DIR = Join-Path $repo 'dist\ffmpeg-windows-x86_64\lib'
          $env:PATH = "$(Join-Path $repo 'dist\ffmpeg-windows-x86_64\bin');$env:PATH"
          Push-Location apps/nian-desktop
          try {
            Invoke-NianNative { & ..\..\ui\node_modules\.bin\tauri.CMD build --target x86_64-pc-windows-msvc --config tauri.windows.release.generated.conf.json --no-bundle --ci }
          }
          finally { Pop-Location }

      - name: Restage with desktop dependency closure
        shell: pwsh
        run: scripts/release/stage-windows.ps1

      - name: Dispose generated Windows Tauri configuration
        if: always()
        shell: pwsh
        run: Remove-Item apps/nian-desktop/tauri.windows.release.generated.conf.json -Force -ErrorAction SilentlyContinue

      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-build
          path: |
            target/x86_64-pc-windows-msvc/release/nian-desktop.exe
            dist/windows-x86_64/
          if-no-files-found: error
          retention-days: 1

  sign-windows:
    name: Sign, install-smoke and finalize Windows candidate
    needs: [release-preflight, build-windows]
    runs-on: windows-2022
    timeout-minutes: 75
    environment: production-release
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install pinned Rust 1.98.0 MSVC and Tauri signing toolchain
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { rustup.exe toolchain install 1.98.0-x86_64-pc-windows-msvc --profile minimal }
          Invoke-NianNative { rustup.exe override set 1.98.0 }
          Invoke-NianNative { cargo.exe install tauri-cli --version 2.11.4 --locked }

      - name: Install pinned Node.js
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'node-v26.7.0-win-x64.zip'
          Invoke-WebRequest 'https://nodejs.org/dist/v26.7.0/node-v26.7.0-win-x64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'd3bd72755141ed32bbcd841228ee81897c8a98d50dfa7dae2179399a0a7c90f8') { throw 'Node.js Windows archive SHA-256 mismatch' }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'node-v26.7.0-win-x64'
          $env:PATH = "$nodeRoot;$env:PATH"
          Add-Content $env:GITHUB_PATH $nodeRoot

      - name: Download unsigned Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-unsigned-build
          path: .

      - name: Scan staged Windows runtime boundary
        shell: pwsh
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { node.exe scripts/release/scan-release-secrets.mjs dist/windows-x86_64 }

      - name: Generate Windows bundle configuration
        shell: pwsh
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
          NIAN_UPDATER_ENDPOINT: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { node.exe scripts/release/write-tauri-windows-release-config.mjs }

      - name: Authenticode-sign Windows application binaries when configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          REQUIRE_WINDOWS_AUTHENTICODE: ${{ vars.REQUIRE_WINDOWS_AUTHENTICODE }}
        run: |
          scripts/release/sign-authenticode-windows.ps1 `
            -Path @('target/x86_64-pc-windows-msvc/release/nian-desktop.exe','dist/windows-x86_64/runtime/nian-media-worker.exe') `
            -StateFile 'dist/windows-authenticode-state.json'
          Copy-Item -Force 'dist/windows-x86_64/runtime/nian-media-worker.exe' 'dist/windows-x86_64/tauri/nian-media-worker-x86_64-pc-windows-msvc.exe'

      - name: Build NSIS installer from exact signed-or-explicitly-unsigned inputs
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          Push-Location apps/nian-desktop
          try {
            Invoke-NianNative { cargo.exe tauri bundle --target x86_64-pc-windows-msvc --config tauri.windows.release.generated.conf.json --bundles nsis --ci --no-sign }
          }
          finally { Pop-Location }

      - name: Dispose generated Windows Tauri configuration
        if: always()
        shell: pwsh
        run: Remove-Item apps/nian-desktop/tauri.windows.release.generated.conf.json -Force -ErrorAction SilentlyContinue

      - name: Authenticode-sign and verify final NSIS installer when configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          REQUIRE_WINDOWS_AUTHENTICODE: ${{ vars.REQUIRE_WINDOWS_AUTHENTICODE }}
        run: |
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer" }
          scripts/release/sign-authenticode-windows.ps1 -Path @($installers[0].FullName) -StateFile 'dist/windows-authenticode-state.json'

      - name: Sign final Windows updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . scripts/release/windows-native.ps1
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer" }
          Invoke-NianNative { cargo.exe tauri signer sign $installers[0].FullName }

      - name: Verify Windows updater signature
        shell: pwsh
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
        run: |
          . scripts/release/windows-native.ps1
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          $env:NIAN_UPDATER_PUBLIC_KEY = $env:NIAN_UPDATER_PUBLIC_KEY
          Invoke-NianNative { cargo.exe run --quiet -p nian-release-verifier -- $installers[0].FullName "$($installers[0].FullName).sig" }

      - name: Smoke actual Windows NSIS install upgrade containment and uninstall
        shell: pwsh
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: |
          $installers = @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis' -File -Filter '*-setup.exe')
          scripts/release/smoke-windows-installer.ps1 -Installer $installers[0].FullName -ExpectedVersion '${{ needs.release-preflight.outputs.version }}'

      - name: Finalize Windows platform candidate
        shell: pwsh
        run: |
          . scripts/release/windows-native.ps1
          $state = Get-Content 'dist/windows-authenticode-state.json' -Raw | ConvertFrom-Json
          $env:NIAN_WINDOWS_AUTHENTICODE_SIGNED = if ($state.authenticode_signed) { 'true' } else { 'false' }
          Invoke-NianNative { node.exe scripts/release/finalize-platform-candidate.mjs windows }

      - name: Scan finalized Windows candidate
        shell: pwsh
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: |
          . scripts/release/windows-native.ps1
          Invoke-NianNative { node.exe scripts/release/scan-release-secrets.mjs dist/candidate-windows }

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-candidate
          path: dist/candidate-windows/
          if-no-files-found: error
          retention-days: 1


  verify-release:
    name: Verify complete Linux and Windows release
    needs: [release-preflight, sign-linux, sign-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download Linux release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-candidate
          path: dist/candidate-linux

      - name: Download Windows release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release-candidate
          path: dist/candidate-windows

      - name: Install pinned Node.js and Rust verifier toolchain
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --output "/tmp/${node_archive}" "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee  /tmp/${node_archive}" | sha256sum --check --strict -
          sudo tar --extract --xz --file "/tmp/${node_archive}" --directory /usr/local --strip-components=1
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0

      - name: Assemble one public multi-platform release
        env:
          NIAN_RELEASE_DOWNLOAD_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: node scripts/release/assemble-release.mjs

      - name: Validate combined metadata hashes and required platforms
        env:
          NIAN_EXPECTED_RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
          NIAN_EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          NIAN_REQUIRE_WINDOWS_AUTHENTICODE: ${{ vars.REQUIRE_WINDOWS_AUTHENTICODE }}
        run: node scripts/release/validate-multiplatform-release.mjs

      - name: Reverify both updater signatures
        env:
          NIAN_UPDATER_PUBLIC_KEY: ${{ vars.NIAN_UPDATER_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          version='${{ needs.release-preflight.outputs.version }}'
          linux="dist/release/Nian-Vision_${version}_linux-x86_64.AppImage"
          windows="dist/release/Nian-Vision_${version}_windows-x86_64-setup.exe"
          NIAN_UPDATER_PUBLIC_KEY="$NIAN_UPDATER_PUBLIC_KEY" cargo run --quiet -p nian-release-verifier -- "$linux" "${linux}.sig"
          NIAN_UPDATER_PUBLIC_KEY="$NIAN_UPDATER_PUBLIC_KEY" cargo run --quiet -p nian-release-verifier -- "$windows" "${windows}.sig"

      - name: Verify global checksum manifest
        run: |
          set -Eeuo pipefail
          cd dist/release
          sha256sum --check --strict SHA256SUMS.txt

      - name: Final multi-platform secret sentinel scan
        env:
          NIAN_RELEASE_SECRET_SENTINEL: ${{ secrets.NIAN_RELEASE_SECRET_SENTINEL }}
        run: node scripts/release/scan-release-secrets.mjs dist/release

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [release-preflight, verify-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
          path: dist/release

      - name: Create clean draft release
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -Eeuo pipefail
          command -v gh >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [[ "$is_draft" == "true" ]] || { echo "refusing to overwrite an already-published release" >&2; exit 1; }
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          release_flags=(--verify-tag --draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${release_flags[@]}" \
            --title "Nian Vision ${RELEASE_TAG#v}" --notes-file dist/release/RELEASE_NOTES.md

      - name: Upload all finalized public assets to draft
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY"

      - name: Re-download and verify draft release bytes
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -Eeuo pipefail
          rm -rf draft-download
          mkdir draft-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir draft-download
          candidate_names="$(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)"
          draft_names="$(find draft-download -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$candidate_names" == "$draft_names" ]] || { echo "draft release asset filenames differ from verified candidate" >&2; exit 1; }
          while IFS= read -r name; do
            cmp --silent "dist/release/$name" "draft-download/$name" || { echo "draft release asset bytes differ: $name" >&2; exit 1; }
          done <<< "$candidate_names"
          cd draft-download
          sha256sum --check --strict SHA256SUMS.txt

      - name: Publish verified draft release
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
